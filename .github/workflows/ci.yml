name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Ce que le serveur embarque réellement : `tsconfig.build.json` exclut
      # les tests et fige `rootDir`, donc il attrape ce qui casserait le
      # paquet livré.
      - name: Type-check (code livré)
        run: npx tsc --noEmit -p tsconfig.build.json

      # Et les tests, que la config précédente ignore entièrement : elle
      # couvre 167 fichiers source et zéro fichier de test. Une erreur de
      # type dans un mock passait donc la CI sans être vue — c'est arrivé
      # deux fois en une seule session de développement.
      - name: Type-check (tests inclus)
        run: npx tsc --noEmit

      - name: Tests unitaires
        run: npm run test

      - name: Build
        run: npm run build

      # Ce que `dist/` importe doit être installé par `npm ci --omit=dev`,
      # sinon l'image Docker ne démarre pas. Deux paquets y manquaient —
      # @prisma/client et dotenv — et rien ne pouvait le voir : le
      # développement et les tests tournent avec toutes les dépendances.
      - name: Les dépendances de production suffisent-elles ?
        run: node scripts/verifier-dependances.mjs

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Absents jusqu'ici : le frontend n'était vérifié que par ses tests et
      # son build. Une erreur de lint ou de type pouvait donc arriver sur
      # `main` sans que rien ne s'y oppose.
      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Tests unitaires
        run: npm run test

      - name: Build
        run: npm run build

      # ── LE SERVICE WORKER ────────────────────────────────────────────────
      #
      # `public/` ne traverse ni le lint, ni TypeScript, ni le build : une
      # faute de syntaxe dans `sw.js` passe la CI sans rien allumer. Ce n'est
      # pas une supposition — la faute a été plantée exprès, et lint comme
      # build ont répondu « aucune erreur ».
      #
      # Et le worker échoue en silence par conception : son enregistrement
      # vit dans un `catch` vide, parce qu'un worker cassé ne doit pas
      # empêcher le produit de fonctionner en ligne. Personne ne verrait donc
      # non plus la panne en production. Sans ces deux étapes, le démarrage
      # hors ligne pourrait disparaître pendant des semaines.
      - name: Le service worker est-il du JavaScript valide ?
        run: node --check public/sw.js

      # La vraie vérification : on coupe le réseau dans un vrai navigateur.
      # Elle attrape ce que `--check` ne peut pas voir — un worker qui se
      # charge mais sert la mauvaise chose, ce qui est la panne la plus
      # coûteuse qu'un service worker sache produire.
      #
      # Le serveur n'est pas nécessaire : les écrans visités ici sont publics
      # et rendus côté client. Ce job reste donc indépendant de la base.
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: L'application s'ouvre-t-elle sans réseau ?
        run: |
          npx next start -H 127.0.0.1 -p 3001 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3001/login > /dev/null 2>&1 && break
            sleep 2
          done
          node ../scripts/hors-ligne.mjs --web http://127.0.0.1:3001 --navigateur chromium

  # LES TESTS DE BOUT EN BOUT, SUR UNE BASE JETABLE
  #
  # Ils ne tournaient pas ici, pour une raison qui semblait close : les
  # brancher demanderait de déposer la chaîne de connexion Supabase dans
  # les secrets GitHub, donc d'exposer un accès à l'instance qui héberge
  # aussi la production.
  #
  # L'objection tenait à l'instance, pas aux tests. Un conteneur Postgres
  # créé et détruit avec le job n'a rien à voir avec Supabase : pas de
  # secret à déposer, pas d'accès à exposer, et une base vide à chaque
  # exécution — ce qui éprouve en prime que le schéma se pose à neuf.
  #
  # Ce que leur absence coûtait : 251 tests ne tournaient que quand
  # quelqu'un y pensait. Trois d'entre eux sont restés rouges sans que
  # personne le sache, et ils avaient raison — ils décrivaient une
  # régression réelle du produit.
  e2e:
    name: Bout en bout
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ignitux
          POSTGRES_PASSWORD: ignitux
          # Le nom compte : test/setup-e2e.ts refuse de démarrer sur toute
          # base qui ne s'appelle pas ainsi. Le garde-fou reste actif ici.
          POSTGRES_DB: ignitux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ignitux:ignitux@localhost:5432/ignitux_test
      JWT_SECRET: secret-de-ci-sans-valeur-hors-de-ce-job-mais-assez-long
      JWT_EXPIRES_IN: 1d
      FRONTEND_URL: http://localhost:3001
      # Éteints, et ce n'est pas un détail : le budget IA est plafonné à
      # 50 €/mois, et une CI qui appelle Claude à chaque push le mangerait
      # sans que personne ne décide rien. Les tests n'en ont pas besoin —
      # le produit fonctionne générateurs éteints, c'est un principe.
      IGINI_AI_ENABLED: 'false'
      MAIL_TRANSPORT: log
      TRUST_PROXY: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Sur une base vide : c'est aussi la seule vérification automatique
      # que le schéma se pose de zéro, ce qu'aucun autre job ne fait.
      - name: Poser le schéma
        run: npx prisma db push

      - name: Tests de bout en bout
        run: npm run test:e2e

      # ── LE COURRIER PART-IL VRAIMENT ? ──────────────────────────────────
      #
      # Tout ce qui touche à l'email était simulé : les tests unitaires
      # remplacent `nodemailer`, donc ils vérifient nos décisions et jamais
      # notre capacité à poser un message sur une socket. Le jour où un
      # fournisseur sera branché serait le premier où quelqu'un le découvre.
      #
      # `courrier-reel.mjs` ouvre une boîte aux lettres SMTP locale, démarre le
      # serveur en transport « smtp » contre elle, et suit les deux parcours
      # jusqu'au bout : confirmation d'adresse et mot de passe oublié. Aucun
      # fournisseur, aucun secret, aucun message vers l'extérieur.
      #
      # Ce que ça ne couvre pas, et que rien ici ne peut couvrir : qu'un
      # message arrive dans une vraie boîte sans finir en indésirable.
      - name: Construire le serveur
        run: npm run build

      - name: Le courrier part-il vraiment ?
        run: node ../scripts/courrier-reel.mjs --port 3002

  # LES IMAGES SE CONSTRUISENT-ELLES ?
  #
  # Les Dockerfiles ont été écrits sur une machine sans Docker : ils sont
  # justes en lecture, et rien de plus. Ce job en fait un fait vérifié à
  # chaque poussée, au lieu de le découvrir au premier déploiement.
  #
  # On construit sans pousser : aucun registre, aucun identifiant. Ce qui
  # est éprouvé ici est la construction, pas la distribution.
  images:
    name: Images Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image du serveur
        run: docker build -t ignitux-backend:ci ./backend

      # L'adresse de l'API est gravée dans le paquet au build (voir
      # frontend/Dockerfile). On passe une valeur factice : ce qu'on
      # vérifie ici est que la construction aboutit, pas qu'elle pointe au
      # bon endroit.
      - name: Construire l'image de l'interface
        run: docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:3000 -t ignitux-frontend:ci ./frontend

      - name: La composition est-elle valide ?
        run: docker compose config --quiet
        env:
          JWT_SECRET: secret-de-ci-sans-valeur-hors-de-ce-job-mais-assez-long

      # ── L'IMAGE DÉMARRE-T-ELLE ? ────────────────────────────────────────
      #
      # Construire n'est pas démarrer, et la différence a coûté cher :
      # @prisma/client et dotenv étaient rangés en devDependencies, donc
      # absents après `npm ci --omit=dev`. L'image se construisait très bien
      # et s'arrêtait au premier import :
      #
      #     Cannot find package 'dotenv' imported from /app/dist/main.js
      #
      # Personne ne pouvait le voir : le développement installe tout, les
      # tests aussi, et ce job s'arrêtait à la construction. On la démarre
      # donc pour de vrai, contre une base jetable.
      - name: Démarrer une base jetable
        run: |
          docker run -d --name base-fumee             -e POSTGRES_USER=ignitux -e POSTGRES_PASSWORD=ignitux -e POSTGRES_DB=ignitux             -p 5432:5432 postgres:17
          for i in $(seq 1 30); do
            docker exec base-fumee pg_isready -U ignitux && break
            sleep 2
          done

      - name: Poser le schéma
        run: |
          docker run --rm --network host             -e DATABASE_URL=postgresql://ignitux:ignitux@localhost:5432/ignitux             -v "$PWD/backend:/w" -w /w node:24-slim             sh -c "npm ci --silent && npx prisma db push --skip-generate"

      - name: L'image du serveur répond-elle ?
        run: |
          docker run -d --name serveur-fumee --network host             -e DATABASE_URL=postgresql://ignitux:ignitux@localhost:5432/ignitux             -e JWT_SECRET=secret-de-ci-sans-valeur-hors-de-ce-job-mais-assez-long             -e FRONTEND_URL=http://localhost:3001             -e TRUST_PROXY=false -e MAIL_TRANSPORT=log -e IGINI_AI_ENABLED=false             -e PORT=3000             ignitux-backend:ci

          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3000/health > /dev/null 2>&1; then
              echo "le serveur répond"
              curl -s http://localhost:3000/health
              exit 0
            fi
            sleep 2
          done

          echo "::error::l'image démarre mais ne répond pas sur /health"
          docker logs serveur-fumee | tail -40
          exit 1

      - name: Journaux du serveur, quoi qu'il arrive
        if: always()
        run: docker logs serveur-fumee 2>&1 | tail -30 || true
