# ═══════════════════════════════════════════════════════════════════════════
# IGNITUX, DE BOUT EN BOUT, SUR UNE SEULE MACHINE
#
# Trois services : une base, le serveur, l'interface. Aucune dépendance à un
# hébergeur extérieur.
#
# ── Pourquoi une base ici ─────────────────────────────────────────────────
#
# Les trois environnements du projet pointaient sur une seule instance
# distante. Quand elle s'est arrêtée, le développement, les tests et la
# production se sont arrêtés ensemble. Cette base-ci rend le développement
# et les tests indépendants de tout service tiers : elle démarre avec le
# reste, se jette et se recrée.
#
# Elle n'est PAS destinée à porter des données réelles. Le volume est nommé
# et persiste entre deux démarrages, mais un `docker compose down -v`
# l'efface sans confirmation.
#
# ── Usage ─────────────────────────────────────────────────────────────────
#
#   cp .env.docker.example .env.docker   puis remplir JWT_SECRET
#   docker compose --env-file .env.docker up --build
#
#   # une fois les services sains, poser le schéma (geste explicite),
#   # DEPUIS L'HÔTE et non dans le conteneur :
#   cd backend
#   DATABASE_URL=postgresql://ignitux:ignitux@localhost:5432/ignitux \
#     npx prisma db push
#
# L'interface répond sur http://localhost:3001, l'API sur http://localhost:3000.
#
# ── Pourquoi depuis l'hôte, et pas `docker compose exec` ──────────────────
#
# Parce que la CLI Prisma n'est pas dans l'image, et ne doit pas y être :
# c'est un outil de construction, et l'image d'exécution installe
# `npm ci --omit=dev`. La commande `docker compose exec backend npx prisma
# db push` — qui figurait ici — échouait donc silencieusement au premier
# essai, sur un « command not found » que rien n'expliquait.
#
# Le port de la base est ouvert sur la boucle locale exactement pour ce
# genre de geste : poser le schéma, ouvrir Prisma Studio, sauvegarder.
# ═══════════════════════════════════════════════════════════════════════════

services:
  base:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ignitux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ignitux}
      POSTGRES_DB: ${POSTGRES_DB:-ignitux}
    volumes:
      - donnees:/var/lib/postgresql/data
    ports:
      # Exposé pour que Prisma Studio et les scripts de sauvegarde puissent
      # l'atteindre depuis la machine hôte — et **seulement** depuis elle.
      #
      # `'5432:5432'` écoute sur toutes les interfaces : la base devient
      # joignable depuis tout le réseau local, et depuis Internet si la
      # machine est un serveur. Avec le mot de passe par défaut `ignitux`,
      # cela revient à publier la base. `127.0.0.1:` la garde sur la boucle
      # locale, ce qui suffit à tous les usages pour lesquels ce port est
      # ouvert.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      # Les deux autres services attendent cette réponse. Sans elle, le
      # serveur démarre avant la base et échoue à la première requête —
      # panne classique, et trompeuse parce qu'elle ressemble à un bug.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ignitux}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      base:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ignitux}:${POSTGRES_PASSWORD:-ignitux}@base:5432/${POSTGRES_DB:-ignitux}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est requis — voir .env.docker.example}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      PORT: '3000'
      # « false » : aucun proxy devant le serveur dans cette composition.
      # Derrière un reverse proxy réel, poser le nombre de sauts.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # « log » par défaut : rien ne part, les messages vont au journal.
      # C'est une décision explicite, pas un oubli — et elle veut dire que
      # la réinitialisation de mot de passe ne fonctionne pas.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
      MAIL_FROM: ${MAIL_FROM:-Ignitux <bonjour@exemple.test>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Éteints par défaut : une composition qu'on lance pour essayer ne
      # doit pas se mettre à dépenser du budget IA sans qu'on l'ait demandé.
      IGINI_AI_ENABLED: ${IGINI_AI_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IGNITUX_RAISON_SOCIALE: ${IGNITUX_RAISON_SOCIALE:-Ignitux}
      IGNITUX_ADRESSE: ${IGNITUX_ADRESSE:-Adresse à renseigner}
      IGNITUX_EMAIL: ${IGNITUX_EMAIL:-contact@exemple.test}
      IGNITUX_IBAN: ${IGNITUX_IBAN:-}
      IGNITUX_BIC: ${IGNITUX_BIC:-}
      PAIEMENT_FOURNISSEUR: ${PAIEMENT_FOURNISSEUR:-aucun}
    ports:
      - '3000:3000'
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Gravée dans le paquet au build — voir frontend/Dockerfile. La
        # changer demande de reconstruire l'image, pas de redémarrer.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      backend:
        condition: service_started
    ports:
      - '3001:3001'
    restart: unless-stopped

volumes:
  donnees:
